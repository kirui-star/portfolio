name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::349629121747:role/GitHubActions-Portfolio-Deploy
          aws-region: us-east-2

      - name: Deploy website to S3
        run: aws s3 sync . s3://kiruilabs-portfolio-2026 --delete --exclude ".git/*" --exclude ".github/*"

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id E18FIE9QN73QX8 --paths "/*"
